# Per-model chat context overrides. Drop this file next to the unit as
# /etc/systemd/system/qwen-draw@<user>.service.d/override.conf, then
# `sudo systemctl daemon-reload && sudo systemctl restart qwen-draw@<user>`.
#
# 14B models at the default 32768 context spill their KV cache onto the CPU
# and generate ~3x slower; the values below keep each model fully in VRAM on
# a 12GB card. Keep the value single-quoted exactly like this — an unquoted
# JSON value loses its embedded double quotes in systemd parsing and the
# service refuses to start (draw_server validates the json at startup).
[Service]
Environment='CHAT_NUM_CTX_OVERRIDES={"ministral3-14b-heresy":16384,"qwen3-14b-uncensored":12288}'
